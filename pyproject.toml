[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-director"
version = "0.1.0"
description = "Turn a screenplay into a scene-by-scene AI video shot list with ready-to-paste image and video prompts."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammed Hassan bin Tayyeb", email = "hasaantayyb1@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-video", "shot-list", "screenplay", "prompt-engineering", "text-to-video"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scene-director = "scene_director.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scene_director = ["templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
